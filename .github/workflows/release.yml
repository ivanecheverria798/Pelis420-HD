name: Build and publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project and internet permission
        working-directory: mobile
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --project-name=pelis420_hd .; fi
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          fi
          sed -i 's/android:label="[^"]*"/android:label="Pelis420 HD"/' android/app/src/main/AndroidManifest.xml
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze
      - working-directory: mobile
        run: flutter test
      - working-directory: mobile
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  ios-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project
        working-directory: mobile
        run: |
          if [ ! -d ios ]; then flutter create --platforms=ios --project-name=pelis420_hd .; fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Pelis420 HD'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Pelis420 HD'" ios/Runner/Info.plist
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze
      - working-directory: mobile
        run: flutter test
      - working-directory: mobile
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        working-directory: mobile
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          /usr/bin/zip -r Pelis420-HD-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: mobile/Pelis420-HD-unsigned.ipa
          if-no-files-found: error
  publish:
    needs: [android, ios-unsigned]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.apk
            release-assets/**/*.ipa
